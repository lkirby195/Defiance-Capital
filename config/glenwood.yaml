# GLENWOOD tunables.  # SPEC §10
#
# EVERY VALUE IN THIS FILE IS A PLACEHOLDER until GLENWOOD fills it in.
# Loaded and validated by config/config.py at startup; a missing key, an unknown key,
# or an out-of-range value stops the service. The config hash recorded on every
# screens/underwrites row is computed from the validated values, so comments and
# key order do not change it.

credit:                                   # SPEC §7.1
  floor_tranche: T4                       # below this tranche the screen declines (SPEC §7.5)
  tranche_cutoffs:                        # FICO lower bound per tranche; T5 is everything below T4
    T1: 740
    T2: 700
    T3: 660
    T4: 620

screen:                                   # SPEC §7.5
  tolerance_band: 0.05                    # leverage above cap by <= this -> Conditional; beyond -> Decline

flags:                                    # SPEC §7.2, §8.8
  severities:
    BANKRUPTCY_IN_LOOKBACK: HARD
    ACTIVE_FORECLOSURE_AS_OWNER: HARD
    UNSATISFIED_JUDGMENT_OVER_THRESHOLD: HARD
    OPEN_TAX_LIEN: HARD                          # any open tax lien, regardless of amount
    ACTIVE_CIVIL_LITIGATION_AS_DEFENDANT: SOFT
    SATISFIED_JUDGMENT_OR_RELEASED_LIEN_IN_LOOKBACK: SOFT
    LANDLORD_TENANT_AS_LANDLORD: INFO
    SUBJECT_PROPERTY_LIEN_OR_LIS_PENDENS: HARD   # applies when senior and unresolved at close
  underwrite_severities:                  # SPEC §8.8 underwrite flags
    DSCR_BELOW_FLOOR: SOFT                       # rental DSCR below rental.dscr_floor (SPEC §8.5)
    TAKE_BACK_DSCR_BELOW_FLOOR: HARD             # take-back DSCR below take_back.dscr_floor (§8.6)
  lookbacks:
    bankruptcy_years: 4
    satisfied_judgment_years: 3
  thresholds:
    unsatisfied_judgments_aggregate_usd: 10000   # sum of unsatisfied judgments across matters
    active_civil_litigation_usd: 25000           # per matter (amount in controversy)

experience:                               # SPEC §7.3
  repeat_borrower_min_tier: E2            # repeat GLENWOOD borrower with clean payoff history is treated as at least this tier

fees:                                     # SPEC §3, §8.1, §8.4
  # Every one but the broker's is the DEFAULT for a SPEC §8.1 input: the team may enter
  # its own number on the deal, and these are what stands in when nobody has.
  origination_default_pct: 0.02           # of the commitment; half at close, half at payoff
  contingency_default_pct: 0.00           # of rehab_costs; rehab_adj = rehab_costs x (1 + this)
  closing_costs_default_usd: 1000.00      # the lender's closing costs; inside the LTC denominator
  holding_costs_default_pct_of_cost: 0.02 # of purchase_price + rehab_costs, TOTAL over the hold
  broker_selling_pct: 0.04                # the flip's cost of selling (SPEC §8.4); not an input

exit:                                     # SPEC §3 exit inference; a team-stated exit always wins
  resale_max_term_months: 9               # term <= this on an SFR / 2-4 infers a resale (flip, or
                                          #   wholetail on that product), which defaults flip on
  hold_min_term_months: 12                # term >= this infers a hold, which defaults rental on;
                                          #   the gap between the two infers nothing (UNKNOWN)

draws:                                    # SPEC §8.3
  listing_months: 3                       # rehab_months = term_months - this, floored at 0;
                                          #   the last months of the term are listing / sale

rental:                                   # SPEC §8.5 rental analysis
  expenses_pct_of_rent: 0.35              # operating expenses as a share of the monthly rent
  takeout_rate: 0.065                     # the rate a takeout lender would amortize at
  amortization_years: 30
  dscr_floor: 1.20                        # flag DSCR_BELOW_FLOOR below this

take_back:                                # SPEC §8.6 take-back analysis; replaces the REO downside
  lost_interest_months: 3                 # months of interest GLENWOOD stops collecting
  legal_costs_usd: 5000.00
  amortization_years: 30                  # debt service is at the deal's OWN interest rate
  dscr_floor: 1.00                        # flag TAKE_BACK_DSCR_BELOW_FLOOR below this

states:                                   # SPEC §10
  served: [OK, CO]
  court_adapter:                          # court-record source per served state (SPEC §6)
    OK: oscn
    CO: colorado_courts

