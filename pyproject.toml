[project]
name = "glenwood-uw"
version = "0.1.0"
description = "GLENWOOD underwriting platform: intake -> enrichment -> screen -> underwrite -> outputs"
readme = "SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    # Starlette's form parser requires it before it will read a body at all, urlencoded
    # included, and the review queue posts every write as a plain HTML form.
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
glenwood = "cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the project is installed so `uv run glenwood` finds the entry point above.
[tool.hatch.build.targets.wheel]
packages = [
    "adapters",
    "api",
    "cli",
    "config",
    "db",
    "engine",
    "intake",
    "outputs",
    "schema",
    "services",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
